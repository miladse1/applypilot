# Tooling configuration for the API. Dependencies are in requirements.txt / requirements-lock.txt.

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# Bugs (pyflakes, bugbear) and security (bandit). Style is left to the existing code.
select = ["E9", "F", "B", "S"]
ignore = [
  "B008",  # FastAPI's Depends() in argument defaults is the framework's pattern
  "B905",  # zip(strict=) would change behaviour where lengths may differ on purpose
  "S110",  # try/except/pass is used deliberately for best-effort cleanup and parsing
  "S112",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S608"]
